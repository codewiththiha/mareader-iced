[package]
name = "mareader-iced"
version = "0.1.0"
edition = "2024"
description = "Mareader — a desktop document reader for long-form reading, built natively with iced."
license = "MIT"

[[bin]]
name = "mareader"
path = "src/main.rs"

[dependencies]
# The interface. The default feature set already carries the wgpu + tiny-skia
# renderers, the thread-pool executor (no async runtime to drag along) and
# both windowing backends; `svg` paints the icon sprite. Later phases add
# `image` (page rasters), `canvas` (overlays) and `lazy` (virtualized rails)
# when they first have something to render with them.
iced = { version = "0.14.0", features = ["svg"] }

# The reader's format-agnostic domain and the library's: the persisted
# settings and appearance models drive the theme, and the library blob,
# folder options and wire types drive the shelf and its imports.
reader-core = { path = "crates/reader-core" }
library-core = { path = "crates/library-core" }

# The PDF's geometry and its device-pixel grid: the app feeds the grid the
# window's live scale factor from the first frame onward.
pdf-core = { path = "crates/pdf-core" }

# The floating-panel placement the menus sit on: the same clamp-and-flip
# arithmetic the web app's popovers ran, ported verbatim.
ui-geom = { path = "crates/ui-geom" }

# Where the app's data lives, per OS convention.
directories = "6"

# The persisted blobs are JSON on disk — the schemas are the crates', the
# encoding is the app's.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The file and folder pickers. Defaults: the XDG portal (with its own
# dialog thread and a zenity fallback) on Linux, the native async panels
# elsewhere — no async runtime to host.
rfd = "0.17.2"

# The subscription building block the progress channel implements:
# `Recipe` is iced_futures' sanctioned extension point, and the facade
# does not re-export it. Same version iced itself resolves, so the
# trait objects are the same types.
iced_futures = "0.14.0"

[dev-dependencies]
# The arrange and drag tests build their rows on the crate's own fixtures;
# the feature compiles them into the test build of the bin alone.
library-core = { path = "crates/library-core", features = ["test-util"] }

[workspace]
members = [
  "crates/ai-core",
  "crates/library-core",
  "crates/md-core",
  "crates/pdf-core",
  "crates/pdf-paper",
  "crates/reader-core",
  "crates/reflow-core",
  "crates/txt-core",
  "crates/ui-geom",
  "crates/virtual-list",
]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info stays out of the build: it multiplies artifact size for nothing
# CI ever reads, and a step-through session is one `debug = 2` edit away.
[profile.dev]
debug = false
strip = "debuginfo"

# Dependencies are not what is being debugged; optimising them costs nothing
# after the first build.
[profile.dev.package."*"]
opt-level = 2
debug = false
